[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e16toomarchy"
version = "0.2.0"
description = "Convert Enlightenment E16 bitmap themes to Omarchy palettes and wallpapers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
e16toomarchy = "e16toomarchy.cli:main"

[tool.setuptools.packages.find]
include = ["e16toomarchy*"]
