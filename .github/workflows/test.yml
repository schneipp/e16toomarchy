name: Converter and frame renderer
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libcairo2-dev libpango1.0-dev libjson-c-dev
      - run: python -m pip install -e .
      - run: make test PYTHON=python
